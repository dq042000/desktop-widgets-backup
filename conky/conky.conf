conky.config = {
    alignment = 'top_right',
    xinerama_head = 1,
    gap_x = 40,
    gap_y = 60,
    update_interval = 1,
    double_buffer = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    draw_shades = true,
    default_shade_color = '000000',
    default_color = 'FFFFFF',
    use_xft = true,
    font = 'Noto Sans CJK TC:size=14',
}

conky.text = [[
${alignr}${font Noto Sans CJK TC:size=56}${time %H:%M}${font Noto Sans CJK TC:size=24}${time :%S}${font}
${alignr}${time %Y 年 %m 月 %d 日  %A}
]]
