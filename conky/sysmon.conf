conky.config = {
    alignment = 'top_right',
    xinerama_head = 1,
    gap_x = 40,
    gap_y = 215,
    minimum_width = 280,
    update_interval = 1,
    double_buffer = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    draw_shades = true,
    default_shade_color = '000000',
    default_color = 'FFFFFF',
    use_xft = true,
    font = 'Noto Sans CJK TC:size=11',
}

conky.text = [[
CPU ${alignr}${cpu cpu0}%
${cpubar cpu0 8}
記憶體 ${alignr}${mem} / ${memmax} (${memperc}%)
${membar 8}
顯示卡 ${alignr}${execi 2 nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits}%  ${execi 2 nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits}°C
${execibar 2 8 nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits}
顯示記憶體 ${alignr}${execi 2 nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader,nounits | awk -F', ' '{printf "%d / %d MiB", $1, $2}'}
硬碟 / ${alignr}${fs_used /} / ${fs_size /} (${fs_used_perc /}%)
${fs_bar 8 /}
硬碟 /home ${alignr}${fs_used /home} / ${fs_size /home} (${fs_used_perc /home}%)
${fs_bar 8 /home}
讀取 ${diskio_read} ${alignr}寫入 ${diskio_write}
]]
